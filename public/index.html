<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamHub - Cloud Cinema</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #f1f1f1; padding: 15px; }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Top Player Area */
    .player-section { background: #181818; border-radius: 12px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    video { width: 100%; max-height: 520px; background: #000; outline: none; }
    .now-playing { padding: 10px 16px; }
    
    /* টাইটেল সাইজ আরও ছোট এবং ক্লিন করা হলো */
    .now-playing h2 { 
      font-size: 0.65rem; 
      font-weight: 600; 
      color: #eaeaea; 
      line-height: 1.4;
      word-break: break-word;
    }

    /* Category Filter Chips */
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 20px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 14px; background: #222; border: 1px solid #333; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 0.8rem; font-weight: 500; color: #ccc; transition: 0.2s; }
    .chip:hover, .chip.active { background: #e50914; border-color: #e50914; color: #fff; }

    /* 4x5 Video Grid */
    .video-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 30px; }
    @media(max-width: 1024px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }
    @media(max-width: 768px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width: 480px) { .video-grid { grid-template-columns: 1fr; } }

    .video-card { background: #181818; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #222; }
    .video-card:hover { transform: translateY(-4px); box-shadow: 0 6px 15px rgba(229,9,20,0.25); border-color: #333; }
    .thumb-wrap { width: 100%; height: 180px; background: #141414; position: relative; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 10px 12px; }
    
    /* কার্ডের টাইটেল সাইজও স্লিম ও সুন্দর করা হলো */
    .card-title { font-size: 0.85rem; font-weight: 500; line-height: 1.35; height: 2.7em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: #ddd; }
    .card-meta { font-size: 0.72rem; color: #777; margin-top: 6px; }

    /* Pagination */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 30px 0; flex-wrap: wrap; }
    .page-btn { padding: 6px 12px; background: #1f1f1f; border: 1px solid #333; border-radius: 6px; color: #bbb; cursor: pointer; font-size: 0.85rem; transition: 0.15s; }
    .page-btn:hover { background: #2a2a2a; color: #fff; }
    .page-btn.active { background: #e50914; border-color: #e50914; color: #fff; font-weight: 600; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- Player Section -->
    <div class="player-section">
      <video id="player" controls playsinline preload="none"></video>
      <div class="now-playing">
        <h2 id="videoTitle">ভিডিও দেখতে নিচের যেকোনো থাম্বনেইলে ক্লিক করুন</h2>
      </div>
    </div>

    <!-- Category Filter -->
    <div class="categories-bar" id="categoryChips">
      <div class="chip active" onclick="setCategory('ALL')">ALL</div>
    </div>

    <!-- Video Grid (4x5 = 20) -->
    <div class="video-grid" id="videoGrid"></div>

    <!-- Pagination Controls -->
    <div class="pagination" id="paginationBar"></div>

  </div>

  <script>
    let currentPage = 1;
    let currentCategory = 'ALL';
    let totalPages = 1;

    async function loadVideos(page = 1, category = 'ALL') {
      currentPage = page;
      currentCategory = category;
      
      const res = await fetch(`/api/videos?page=${page}&category=${encodeURIComponent(category)}`);
      const data = await res.json();
      
      totalPages = data.totalPages;
      renderCategories(data.categories);
      renderGrid(data.videos);
      renderPagination(data.currentPage, data.totalPages);
    }

    function renderCategories(categories) {
      const container = document.getElementById('categoryChips');
      let html = `<div class="chip ${currentCategory === 'ALL' ? 'active' : ''}" onclick="filterCategory('ALL')">ALL</div>`;
      categories.forEach(cat => {
        html += `<div class="chip ${currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</div>`;
      });
      container.innerHTML = html;
    }

    function filterCategory(cat) {
      loadVideos(1, cat);
    }

    function renderGrid(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';

      if (videos.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px 0;">কোনো ভিডিও পাওয়া যায়নি।</p>';
        return;
      }

      videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="thumb-wrap">
            <img src="/api/thumb/${v.id}" onerror="this.src='https://placehold.co/400x225/111/fff?text=No+Thumbnail'" loading="lazy">
          </div>
          <div class="card-info">
            <div class="card-title" title="${v.title}">${v.title}</div>
            <div class="card-meta">
              <span>${v.categories ? v.categories.join(' ') : ''}</span>
            </div>
          </div>
        `;
        card.onclick = () => playVideo(v.id, v.title);
        grid.appendChild(card);
      });
    }

    function playVideo(id, title) {
      const player = document.getElementById('player');
      player.src = `/api/stream/${id}`;
      document.getElementById('videoTitle').innerText = title;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      player.play();
    }

    function renderPagination(current, total) {
      const bar = document.getElementById('paginationBar');
      let html = '';

      html += `<button class="page-btn" ${current === 1 ? 'disabled' : ''} onclick="loadVideos(1, '${currentCategory}')">&laquo; First</button>`;

      let start = Math.max(1, current - 2);
      let end = Math.min(total, current + 2);

      for (let i = start; i <= end; i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="loadVideos(${i}, '${currentCategory}')">${i}</button>`;
      }

      html += `<button class="page-btn" ${current === total ? 'disabled' : ''} onclick="loadVideos(${total}, '${currentCategory}')">Last (${total}) &raquo;</button>`;

      bar.innerHTML = html;
    }

    loadVideos();
  </script>
</body>
</html>
